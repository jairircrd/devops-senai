name: Minha primeira pipeline

on:
  push:
    branches:
      - main

jobs:
  executar-java:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Compilar
        working-directory: aula02devops
        run: javac Main.java

      - name: Executar
        working-directory: aula02devops
        run: java Main
